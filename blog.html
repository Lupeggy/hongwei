<script>
var BLOG_DATA = {"1": {"title": "光纖雷射打標機選購完整指南", "cat": "雷射打標機", "date": "2026年4月", "desc": "光纖雷射打標機以高效率、免維護、壽命長等特點廣泛應用於五金、電子、汽配等產業。本文完整說明選購關鍵規格與注意事項。", "tags": ["光纖雷射打標機", "雷射打標", "Fiber Laser", "打標機選購"], "related_ids": ["2", "3"], "content": "<h2>什麼是光纖雷射打標機？</h2>\n<p>光纖雷射打標機（Fiber Laser Marker）是使用光纖雷射源進行表面雕刻與永久打標的設備。與傳統 CO₂ 或 YAG 雷射相比，光纖雷射具有電光轉換效率高（可達 30% 以上）、無耗材、免維護等核心優勢，廣泛應用於各類金屬及部分非金屬材料的序號、條碼、LOGO 永久打標。</p>\n<div class=\"callout\"><p>光纖雷射壽命長達 <strong>10 萬小時</strong>，相比半導體（YAG）雷射的 1 萬小時，是更適合量產環境的長期投資。</p></div>\n<h2>適用材料</h2>\n<p>光纖雷射波長約 1064nm，對金屬材料的吸收率極高，適用於：</p>\n<ul>\n  <li><strong>不鏽鋼</strong>：食品器具、醫療器械序號</li>\n  <li><strong>鋁材</strong>：3C 產品外殼、工業零件</li>\n  <li><strong>碳鋼、鍍鋅板</strong>：五金工具序號</li>\n  <li><strong>銅、黃銅</strong>：電子連接器、精密零件</li>\n  <li><strong>IC / PCB 電路板</strong>：電子製造追溯</li>\n  <li><strong>工程塑膠（ABS、PA）</strong>：汽車零件標示</li>\n</ul>\n<h2>選購關鍵規格</h2>\n<h3>1. 雷射功率（W）</h3>\n<p>功率越高，打標速度越快，也能處理更硬的材料。</p>\n<table><tr><th>功率</th><th>適用場景</th><th>建議用途</th></tr>\n<tr><td>20W</td><td>輕薄金屬、塑膠</td><td>小批量精細打標</td></tr>\n<tr><td>30W</td><td>一般金屬零件</td><td>中量生產線</td></tr>\n<tr><td>50W</td><td>厚實金屬、深雕</td><td>高速大量生產</td></tr></table>\n<h3>2. 打標速度與重複精度</h3>\n<p>打標速度通常可達 7,000～8,000 mm/s。重複精度影響每個產品打標位置的一致性，高品質機型精度可達 <strong>±0.002mm</strong>，適合 IC 及電子零件等高精度需求。</p>\n<h3>3. 振鏡系統品質</h3>\n<p>振鏡（Galvanometer）決定打標路徑的速度與精確度。建議選用進口振鏡，確保長期穩定性。</p>\n<div class=\"callout\"><p><strong>鴻瑋建議：</strong>選購前務必確認材料種類、批量大小與打標內容，再決定功率與配置，避免過度投資或效能不足。</p></div>\n<h2>售後服務與保固</h2>\n<p>光纖雷射打標機雖然免維護，但定期清潔聚焦鏡片仍是維持品質的關鍵。鴻瑋光電提供全台到府安裝、操作教育訓練、一年保固及零配件現貨供應。</p>"}, "2": {"title": "CNC 雕刻機加工材料完整對照表", "cat": "CNC 雕刻機", "date": "2026年4月", "desc": "CNC 雕刻機可加工木材、壓克力、密集板等多種非金屬材料。本文整理各機型對應材料與加工參數，協助快速選機。", "tags": ["CNC雕刻機", "CNC加工", "非金屬切割", "加工材料"], "related_ids": ["1", "3"], "content": "<h2>CNC 雕刻機能加工哪些材料？</h2>\n<p>CNC 雕刻機（Computer Numerical Control Engraving Machine）透過主軸旋轉刀具進行切削加工，可處理多種非金屬材料，部分高功率機型也能加工軟金屬（如鋁材）。</p>\n<h2>主要加工材料對照表</h2>\n<table><tr><th>材料</th><th>建議主軸功率</th><th>推薦機型</th><th>常見用途</th></tr>\n<tr><td>木材（實木/夾板）</td><td>2.2KW～6KW</td><td>HC-1325 / HA-1530</td><td>家具、木門、藝術品</td></tr>\n<tr><td>密集板（MDF）</td><td>2.2KW～4.5KW</td><td>HC-1325</td><td>系統家具、展示架</td></tr>\n<tr><td>壓克力</td><td>1.5KW～3.5KW</td><td>HC-1325</td><td>燈箱字、展示品</td></tr>\n<tr><td>PVC 發泡板</td><td>1.5KW～3KW</td><td>HC-1325 / HA-1530</td><td>廣告看板、展場佈置</td></tr>\n<tr><td>泡棉 / EVA</td><td>1.5KW 以下</td><td>HC 系列</td><td>包裝內襯、道具</td></tr>\n<tr><td>鋁材（需特殊刀具）</td><td>6KW 以上</td><td>HA-1530 ATC</td><td>工業零件、模具</td></tr></table>\n<h2>自動換刀（ATC）機型的優勢</h2>\n<p>若加工流程需要多種刀具切換，配備自動換刀系統（ATC）的機型如 HA-1530 可大幅減少人工停機時間，適合批量生產環境。</p>\n<div class=\"callout\"><p>木工家具廠建議選擇 4 刀位以上的 ATC 機型，搭配 6KW 主軸，可同時完成開料、鑽孔、造型銑削等多道工序。</p></div>\n<h2>加工參數設定重點</h2>\n<h3>切削速度（Feed Rate）</h3>\n<p>木材一般可設定 15,000～20,000 mm/min，壓克力則建議降至 10,000 mm/min 以下，避免產生熔融邊緣。</p>\n<h3>主軸轉速（RPM）</h3>\n<p>壓克力等熱敏感材料需較高轉速（18,000～24,000 RPM）配合較慢進給，才能得到光滑的切割邊緣。</p>\n<div class=\"callout\"><p><strong>鴻瑋建議：</strong>第一次操作新材料時，建議先以小區域試切，確認參數後再進行批量生產。</p></div>"}, "3": {"title": "CO₂ 雷射切割機 vs 光纖雷射切割機：哪一種適合你？", "cat": "雷射切割機", "date": "2026年4月", "desc": "CO₂ 雷射與光纖雷射是最主流的兩種雷射切割技術。本文一次說明兩者核心差異，幫你快速做出正確選擇。", "tags": ["雷射切割機", "光纖雷射", "CO₂雷射", "選機指南"], "related_ids": ["1", "2"], "content": "<h2>兩種技術的核心差異</h2>\n<p>雷射切割機市場上最常見的兩種技術是 <strong>CO₂ 雷射</strong>（波長 10.6μm）與<strong>光纖雷射</strong>（波長 1.06μm）。波長不同，決定了它們對不同材料的適用性。</p>\n<h2>快速比較表</h2>\n<table><tr><th>比較項目</th><th>CO₂ 雷射切割機</th><th>光纖雷射切割機</th></tr>\n<tr><td>波長</td><td>10.6 μm</td><td>1.06 μm</td></tr>\n<tr><td>適用材料</td><td>壓克力、木材、皮革、布料</td><td>碳鋼、不鏽鋼、鋁材、銅材</td></tr>\n<tr><td>切割金屬</td><td>需特殊配置，效率較低</td><td>專為金屬設計，效率極高</td></tr>\n<tr><td>電耗</td><td>較高（約 10-15KW）</td><td>較低（約 3-8KW）</td></tr>\n<tr><td>維護需求</td><td>需定期更換雷射管</td><td>免維護，壽命 10 萬小時</td></tr>\n<tr><td>設備價格</td><td>相對較低</td><td>相對較高</td></tr></table>\n<h2>CO₂ 雷射適合哪些產業？</h2>\n<ul>\n  <li><strong>廣告招牌業</strong>：壓克力燈箱字、PVC 看板</li>\n  <li><strong>禮品業</strong>：木質禮品雕刻、皮革壓紋</li>\n  <li><strong>包裝業</strong>：紙板、泡棉、不織布切割</li>\n  <li><strong>服裝業</strong>：布料、蕾絲精密切割</li>\n</ul>\n<h2>光纖雷射適合哪些產業？</h2>\n<ul>\n  <li><strong>五金鈑金業</strong>：碳鋼、不鏽鋼板材精密切割</li>\n  <li><strong>汽車零件</strong>：金屬底盤件、車身結構件</li>\n  <li><strong>電子業</strong>：鋁製散熱片、導電片</li>\n  <li><strong>建築裝飾</strong>：不鏽鋼花格、裝飾板</li>\n</ul>\n<div class=\"callout\"><p><strong>混合需求怎麼辦？</strong>鴻瑋光電的 <strong>HS-1530</strong> CO₂ 金屬非金屬兩用機是最佳解決方案，一機多用。</p></div>\n<h2>購機決策建議</h2>\n<p><strong>選 CO₂ 雷射</strong>：主要加工壓克力、木材、皮革等非金屬材料，預算相對有限。</p>\n<p><strong>選光纖雷射</strong>：主要切割不鏽鋼、碳鋼等金屬板材，重視電耗成本，規劃長期高產量金屬加工。</p>\n<div class=\"callout\"><p><strong>免費選機諮詢：</strong>不確定哪種適合您？歡迎 LINE 或電話聯繫鴻瑋光電，說明您的材料、批量與預算，我們提供專業建議。</p></div>"}};
var currentFilter = 'all';

var SVG_ARROW = '<svg width="14" height="14" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5h9M8 4l4.5 3.5L8 11"/></svg>';

function navigateBlog(id) {
  var url = new URL(window.location);
  url.searchParams.set('id', id);
  window.history.pushState({}, '', url);
  loadBlog(id);
  window.scrollTo(0,0);
}

function loadListing() {
  var url = new URL(window.location);
  url.searchParams.delete('id');
  window.history.pushState({}, '', url);

  // Reset meta
  document.getElementById('pg-title').textContent = '雷射設備知識部落格 | 鴻瑋光電有限公司';
  document.getElementById('pg-desc').setAttribute('content', '鴻瑋光電雷射設備部落格：光纖雷射打標機選購指南、CNC雕刻機材料對照表、CO₂vs光纖雷射比較。');
  document.getElementById('pg-canonical').setAttribute('href', 'https://hongweilaser.com/blog.html');

  renderList(currentFilter);
  document.getElementById('blog-detail').style.display = 'none';
  document.getElementById('blog-listing').style.display = 'block';
}

function renderList(cat) {
  currentFilter = cat;
  var grid = document.getElementById('blog-list-grid');
  var html = '';
  Object.keys(BLOG_DATA).forEach(function(id) {
    var b = BLOG_DATA[id];
    if (cat !== 'all' && b.cat !== cat) return;
    var tags = b.tags.slice(0,3).map(function(t) { return '<span class="tag-pill">' + t + '</span>'; }).join('');
    html += '<div class="blog-card" onclick="navigateBlog('' + id + '')">'
      + '<div style="font-family:\'Share Tech Mono\',monospace;font-size:11px;color:#3a5070;letter-spacing:2px;margin-bottom:8px;">' + b.cat + ' · ' + b.date + '</div>'
      + '<h2 style="font-size:18px;font-weight:700;color:#fff;line-height:1.4;margin-bottom:8px;">' + b.title + '</h2>'
      + '<p style="font-size:13px;color:#7a90b0;line-height:1.8;margin-bottom:12px;">' + b.desc + '</p>'
      + '<div style="margin-bottom:12px;">' + tags + '</div>'
      + '<div style="display:flex;align-items:center;gap:6px;color:#ff5c3a;font-size:13px;font-weight:700;">閱讀更多 ' + SVG_ARROW + '</div>'
      + '</div>';
  });
  grid.innerHTML = html || '<p style="color:#3a5070;">此分類暫無文章</p>';
}

function filterPosts(cat, btn) {
  document.querySelectorAll('[onclick^="filterPosts"]').forEach(function(b) {
    b.style.background = 'transparent';
    b.style.color = '#7a90b0';
    b.style.border = '1px solid transparent';
    b.style.fontWeight = '400';
  });
  btn.style.background = 'rgba(220,60,40,.12)';
  btn.style.color = '#ff5c3a';
  btn.style.border = '1px solid rgba(220,60,40,.4)';
  btn.style.fontWeight = '700';
  renderList(cat);
}

function loadBlog(id) {
  var b = BLOG_DATA[id];
  if (!b) { loadListing(); return; }

  // Update SEO meta dynamically
  document.getElementById('pg-title').textContent = b.title + ' | 鴻瑋光電有限公司';
  document.getElementById('pg-desc').setAttribute('content', b.desc);
  document.getElementById('pg-canonical').setAttribute('href', 'https://hongweilaser.com/blog.html?id=' + id);
  document.getElementById('og-title').setAttribute('content', b.title + ' | 鴻瑋光電有限公司');
  document.getElementById('og-desc').setAttribute('content', b.desc);

  document.getElementById('crumb-cat').textContent = b.cat;
  document.getElementById('crumb-title').textContent = b.title;
  document.getElementById('detail-meta').textContent = b.date + ' · 鴻瑋光電 · ' + b.cat;
  document.getElementById('detail-title').textContent = b.title;
  document.getElementById('detail-desc').textContent = b.desc;
  document.getElementById('detail-tags').innerHTML = b.tags.map(function(t) { return '<span class="tag-pill">' + t + '</span>'; }).join('');
  document.getElementById('detail-body').innerHTML = b.content;

  // Related articles
  document.getElementById('related-list').innerHTML = (b.related_ids || []).map(function(rid) {
    var rb = BLOG_DATA[rid];
    if (!rb) return '';
    return '<div class="related-card" onclick="navigateBlog(\'' + rid + '\')">'
      + '<div style="font-size:10px;color:#ff5c3a;font-family:monospace;margin-bottom:4px;">' + rb.cat + '</div>'
      + '<div style="font-size:13px;font-weight:600;color:#e8eef8;line-height:1.4;">' + rb.title + '</div>'
      + '</div>';
  }).join('');

  document.getElementById('blog-listing').style.display = 'none';
  document.getElementById('blog-detail').style.display = 'block';
}

window.addEventListener('popstate', function() {
  var id = new URLSearchParams(window.location.search).get('id');
  if (id) { loadBlog(id); } else { loadListing(); }
});

// Init
renderList('all');
var initId = new URLSearchParams(window.location.search).get('id');
if (initId) { loadBlog(initId); }
</script>
