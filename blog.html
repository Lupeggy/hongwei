  "1": `<h2>什麼是光纖雷射打標機？</h2><p>光纖雷射打標機使用光纖雷射源進行表面雕刻與永久打標。電光轉換效率高達 30% 以上、無耗材、免維護，廣泛應用於五金、電子、汽配等產業永久打標。</p><h2>適用材料</h2><ul><li><strong>不鏽鋼</strong>：食品器具、醫療器械序號</li><li><strong>鋁材</strong>：3C 產品外殼、工業零件</li><li><strong>碳鋼</strong>：五金工具序號</li><li><strong>銅、黃銅</strong>：電子連接器</li><li><strong>IC / PCB</strong>：電子製造追溯</li><li><strong>工程塑膠</strong>：汽車零件標示</li></ul><h2>選購關鍵規格</h2><h3>雷射功率</h3><p>20W 適合輕薄金屬小批量；30W 適合一般金屬零件中量生產；50W 適合厚實金屬高速大量生產。</p><h3>打標速度與精度</h3><p>打標速度可達 7,000～8,000 mm/s，重複精度 ±0.002mm，適合 IC 及電子零件等高精度需求。</p><div class='cb'><p><strong>鴻瑋建議：</strong>選購前確認材料種類、批量大小與打標內容，避免過度投資或效能不足。</p></div>`,
  "2": `<h2>CNC 雕刻機能加工哪些材料？</h2><p>CNC 雕刻機透過主軸旋轉刀具進行切削加工，可處理多種非金屬材料，部分高功率機型也能加工軟金屬（如鋁材）。</p><h2>主要加工材料對照</h2><p>木材（實木/夾板）建議 2.2KW～6KW，適合 HC-1325 / HA-1530，用於家具、木門。密集板（MDF）建議 2.2KW～4.5KW。壓克力建議 1.5KW～3.5KW，適合燈箱字製作。PVC 發泡板建議 1.5KW～3KW，適合廣告看板。鋁材需 6KW 以上搭配特殊刀具。</p><h2>ATC 自動換刀優勢</h2><p>配備 ATC 的 HA-1530 可大幅減少人工停機時間，適合批量生產環境，4 刀位以上搭配 6KW 主軸可同時完成開料、鑽孔、造型銑削。</p><div class='cb'><p>木工進給速度建議 15,000～20,000 mm/min。壓克力降至 10,000 mm/min 以下，轉速 18,000～24,000 RPM 可獲得光滑切割邊緣。</p></div>`,
  "3": `<h2>兩種技術的核心差異</h2><p>CO₂ 雷射波長 10.6μm，光纖雷射波長 1.06μm。波長不同決定了對不同材料的適用性。</p><h2>CO₂ 雷射適合哪些產業？</h2><ul><li><strong>廣告招牌業</strong>：壓克力燈箱字、PVC 看板</li><li><strong>禮品業</strong>：木質禮品雕刻、皮革壓紋</li><li><strong>包裝業</strong>：紙板、泡棉切割</li><li><strong>服裝業</strong>：布料、蕾絲精密切割</li></ul><h2>光纖雷射適合哪些產業？</h2><ul><li><strong>五金鈑金業</strong>：碳鋼、不鏽鋼精密切割</li><li><strong>汽車零件</strong>：金屬底盤件</li><li><strong>電子業</strong>：鋁製散熱片</li><li><strong>建築裝飾</strong>：不鏽鋼花格</li></ul><div class='cb'><p><strong>混合需求？</strong>HS-1530 CO₂ 金屬非金屬兩用機是最佳解決方案，一機多用。</p></div><p>選 CO₂：主要加工壓克力、木材、皮革等非金屬。選光纖：主要切割不鏽鋼、碳鋼等金屬板材。</p>`,
  "4": `<h2>木工 CNC 雕刻機是什麼？</h2><p>利用電腦數值控制（CNC）技術，驅動主軸刀具對木材、密集板（MDF）、夾板等材料進行精密雕刻、切割、鑽孔加工，廣泛應用於系統家具、木門製造、裝潢木工等產業。</p><h2>選購五大關鍵</h2><h3>1. 主軸功率</h3><p>薄板（18mm 以下）：2.2KW～4.5KW；實木厚板（40mm 以上）：6KW～9KW；鋁材加工：9KW～13.5KW。</p><h3>2. 工作台尺寸</h3><p>標準全床 1300×2500mm（對應 4×8 尺板材），加工更大板材可選加長機型。</p><h3>3. ATC 自動換刀</h3><p>3 刀位適合一般木工廣告材料；6 刀位適合系統家具木門；12 刀位適合批量生產多工序。ATC 換刀只需 5-10 秒，生產效率提升 3-5 倍。</p><h3>4. 控制系統</h3><p>建議選擇 DSP 或 Syntec 數控系統，操作介面直覺，支援 USB 傳輸與網路連線。</p><h3>5. 機身結構</h3><p>全焊接加強鋼構底座有效消除加工共振，長期高精度穩定作業，重複精度可達 ±0.05mm。</p><div class='cb'><p><strong>Q：木工 CNC 可以切鋁材嗎？</strong> 可以，但需搭配 9KW 以上主軸和特殊鋁材刀具。HA-1530 13.5KW 機型可穩定加工鋁材。</p></div>`,
  "5": `<h2>為什麼壓克力切割要用 CO₂ 雷射？</h2><p>壓克力對 CO₂ 雷射的 10.6μm 波長吸收率極高，切割時材料直接汽化，切割面光滑透明，無需後處理。光纖雷射（1.06μm）無法有效被壓克力吸收，不適合壓克力切割。</p><h2>壓克力切割功率建議</h2><p>3mm 以下：60W～80W，速度 30-50mm/s；5-10mm：80W～120W，速度 15-25mm/s；10-20mm：120W～150W，速度 8-15mm/s；20mm 以上：150W 以上，速度 5-8mm/s。</p><h2>如何讓切割邊緣更光亮？</h2><ul><li>降低切割速度：速度越慢，邊緣越光滑</li><li>提高雷射功率：讓材料完整汽化而非熔化</li><li>使用輔助氣體：吹空氣或氮氣排除廢渣</li><li>保護膜保留：切割時保留表面保護膜</li></ul><div class='cb'><p><strong>小技巧：</strong>建議「空燒」暖機後再切割，讓第一刀的切割品質更穩定。</p></div>`,
  "6": `<h2>台灣買雷射切割機，選廠商比選機台更重要</h2><p>雷射切割機平均使用 8-15 年，廠商的服務能力直接影響你的生產穩定性。選購前從以下面向評估廠商：</p><h2>評估廠商的六個關鍵問題</h2><h3>1. 有沒有台灣本地技術人員？</h3><p>許多低價設備從中國直接代理，台灣沒有維修人員，設備故障時停機損失往往遠超過當初省下的價差。</p><h3>2. 零配件有沒有現貨庫存？</h3><p>雷射管、聚焦鏡片等消耗品是最常更換的零件。鴻瑋光電在台灣備有 Synrad、Rofin 等進口品牌雷射管及光學件現貨。</p><h3>3. 安裝調機是否到府服務？</h3><p>設備安裝需要專業調機才能達到最佳精度，部分廠商只負責送達不提供安裝。</p><h3>4. 技術支援的回應速度？</h3><p>設備出問題時，廠商的回應速度直接影響損失。建議詢問是否提供 LINE 或電話即時支援。</p><h3>5. 有沒有試機機會？</h3><p>好的廠商會讓你攜帶自己的加工材料到廠試機，確認設備效果後再購買。</p><div class='cb'><p><strong>鴻瑋光電服務承諾：</strong>全台到府安裝、操作訓練、24H LINE/電話技術支援、台灣本地零配件庫存、14年服務超過500家客戶。</p></div>`,
  "7": `<h2>台灣雷射切割機市場價格概況</h2><p>雷射切割機因機型、功率、品牌不同，價格差異極大。以下是 2026 年台灣市場合理價格參考（含基本安裝）：</p><p>CO₂ 雷射切割機（60-100W）：15-35 萬；CO₂ 雷射切割機（100-200W）：30-60 萬；CO₂ 金屬非金屬兩用：60-120 萬；光纖雷射切割機（500W-1000W）：80-150 萬；光纖雷射切割機（2000W+）：150-400 萬；CNC 雕刻機（標準款）：20-50 萬；CNC 雕刻機（ATC 自動換刀）：50-120 萬；光纖雷射打標機：8-25 萬。</p><h2>影響價格的關鍵因素</h2><h3>1. 雷射源品牌</h3><p>進口品牌（Synrad、Rofin 德國）壽命長、穩定度高，但比台產或中國品牌高 30-50%。光纖雷射源：IPG（德國）是頂級品牌，Raycus（中國）性價比高。</p><h3>2. 機台尺寸與重量</h3><p>機台越大越重代表結構越穩固，廉價機台通常在機身結構上做妥協，長期使用精度會下降。</p><h3>3. 售後服務能力</h3><p>台灣本地服務廠商，售價通常高 10-20%，但維修快速的優勢在使用期間很快就能回收。</p><div class='cb'><p><strong>採購建議：</strong>不要只看設備售價，要把保固服務費用、零配件費用、停機損失風險全部納入總持有成本計算。</p></div>`,
  "8": `<h2>金屬切割為什麼要用光纖雷射？</h2><p>光纖雷射波長 1.06μm，對金屬的吸收率是 CO₂ 雷射的 10 倍以上，切割效率更高、速度更快、切割面更光滑。</p><h2>各金屬材料切割厚度參考</h2><p>碳鋼：500W 切 3mm、1000W 切 6mm、2000W 切 10mm、6000W 切 20mm+。不鏽鋼：500W 切 2mm、1000W 切 4mm、2000W 切 6mm。鋁材：500W 切 2mm、1000W 切 4mm、2000W 切 6mm。</p><h2>輔助氣體的選擇</h2><ul><li><strong>氧氣（O₂）</strong>：切割碳鋼速度最快，但切割面有氧化色</li><li><strong>氮氣（N₂）</strong>：切割不鏽鋼和鋁材，切割面光亮無氧化</li><li><strong>空氣</strong>：成本最低，適合品質要求不高的場合</li></ul><div class='cb'><p><strong>免費打樣：</strong>攜帶您的金屬板材到鴻瑋光電桃園廠試機，親眼確認切割效果再決定是否購買。</p></div>`,
  "9": `<h2>雷射切割機為什麼需要定期保養？</h2><p>鏡片污染、導軌磨損、散熱不足等問題都會造成切割品質下降甚至設備損壞，正確的保養可延長設備壽命 50% 以上。</p><h2>CO₂ 雷射切割機保養重點</h2><p>每日：清潔保護鏡片（用棉簽沾酒精輕拭）、清除廢料槽積料、確認冷卻水水位。每週：清潔 X/Y 軸導軌並添加潤滑油、檢查皮帶張力、清潔反射鏡和聚焦鏡。每月：更換冷卻水（建議蒸餾水避免水垢）、檢查雷射管功率是否衰退。</p><h2>光纖雷射切割機保養重點</h2><p>光纖雷射源幾乎免維護（10 萬小時壽命），主要保養：保護鏡片每日清潔；切割頭每週拆卸清潔；水冷機定期更換冷卻液；導軌每月潤滑保養。</p><h2>常見故障與排除</h2><p>切割面粗糙→鏡片污染或焦距偏移→清潔鏡片重新對焦。切不斷材料→雷射功率衰退→提高功率或更換雷射管。切割線彎曲→導軌磨損或皮帶鬆動→調整皮帶張力或更換導軌。</p><div class='cb'><p><strong>鴻瑋光電保養服務：</strong>提供定期到府保養，零配件現貨供應，故障快速修復。</p></div>`,
  "10": `<h2>小型工廠選雷射設備的三大考量</h2><p>小型工廠（員工 5-20 人）通常面臨預算有限、空間受限、多材料需求等挑戰。以下根據五種常見需求提供選機建議：</p><h2>五種需求的選機建議</h2><h3>廣告招牌業（壓克力、木板、PVC）</h3><p>推薦 CO₂ 雷射切割機（80-120W），HE-2513 是廣告業主力機型，1300×2500mm 大幅面，投資報酬率高。</p><h3>禮品客製業（皮革、木材）</h3><p>推薦 CO₂ 雷射切割雕刻機（60-80W），可同機完成切割與雕刻，佔地小，是禮品業最划算的入門機型。</p><h3>木工家具業（實木、密集板）</h3><p>推薦 CNC 雕刻機（HC-1325 或 HA-1530），如需批量生產建議直上 ATC 機型。</p><h3>五金鈑金業（不鏽鋼、碳鋼薄板）</h3><p>推薦光纖雷射切割機（500W-1000W），HF-1530 切割速度快、邊緣光滑。</p><h3>電子零件業（序號、條碼打標）</h3><p>推薦光纖雷射打標機（20-30W），體積小、投資低（8-15 萬），最划算的設備投資。</p><div class='cb'><p><strong>免費諮詢：</strong>不確定哪種適合？LINE 或電話聯繫鴻瑋光電，說明材料、批量、預算，提供免費選機建議。</p></div>`
};

function goDetail(id) {
  var b = D[id]; if (!b) return;
  window.history.pushState({},'','blog?id='+id);
  document.getElementById('pg-title').textContent = b.title + ' | 鴻瑋光電有限公司';
  document.getElementById('pg-desc').content = b.desc;
  document.getElementById('pg-can').href = 'https://hongweilaser.com/blog?id='+id;
  document.getElementById('og-t').content = b.title;
  document.getElementById('og-d').content = b.desc;
  document.getElementById('bc').textContent = b.title;
  document.getElementById('dm').textContent = b.date + ' · ' + b.cat;
  document.getElementById('dt').textContent = b.title;
  document.getElementById('dd').textContent = b.desc;
  document.getElementById('dtg').innerHTML = b.tags.map(function(t){return '<span class="pill">'+t+'</span>';}).join('');
  document.getElementById('art').innerHTML = C[id] || '';
  document.getElementById('rel').innerHTML = (b.related||[]).map(function(rid){
    var r=D[rid]; if(!r) return '';
    return '<button class="rel-card" onclick="goDetail(''+rid+'')">'
      +'<div style="font-size:10px;color:#ff5c3a;font-family:monospace;margin-bottom:4px;">'+r.cat+'</div>'
      +'<div style="font-size:12px;font-weight:600;color:#e8eef8;line-height:1.4;">'+r.title+'</div>'
      +'</button>';
  }).join('');
  document.getElementById('vl').style.display='none';
  document.getElementById('vd').style.display='block';
  window.scrollTo(0,0);
}

function goList() {
  window.history.pushState({},'','blog');
  document.getElementById('pg-title').textContent = '雷射設備知識部落格 | 鴻瑋光電有限公司';
  document.getElementById('pg-can').href = 'https://hongweilaser.com/blog';
  document.getElementById('vd').style.display='none';
  document.getElementById('vl').style.display='block';
  window.scrollTo(0,0);
}

function renderList(cat) {
  var html = '';
  Object.keys(D).forEach(function(id) {
    var b=D[id];
    if (cat!=='全部' && b.cat!==cat) return;
    var tags = b.tags.slice(0,3).map(function(t){return '<span class="pill">'+t+'</span>';}).join('');
    html += '<button class="blog-card" onclick="goDetail(''+id+'')">'
      +'<div style="display:flex;gap:8px;align-items:center;margin-bottom:8px;">'
      +'<span style="font-size:10px;color:#ff5c3a;background:rgba(220,60,40,.1);border:1px solid rgba(220,60,40,.25);padding:2px 8px;border-radius:3px;font-family:monospace;">'+b.cat+'</span>'
      +'<span style="font-size:11px;color:#3a5070;font-family:monospace;">'+b.date+'</span></div>'
      +'<div style="font-size:17px;font-weight:700;color:#fff;line-height:1.4;margin-bottom:7px;text-align:left;">'+b.title+'</div>'
      +'<div style="font-size:13px;color:#7a90b0;line-height:1.75;margin-bottom:10px;text-align:left;">'+b.desc+'</div>'
      +'<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;">'
      +'<div>'+tags+'</div>'
      +'<div style="color:#ff5c3a;font-size:13px;font-weight:700;">閱讀更多 →</div>'
      +'</div></button>';
  });
  document.getElementById('grid').innerHTML = html;
}

function buildFilters() {
  document.getElementById('flt').innerHTML = CATS.map(function(c,i){
    return '<button class="filter-btn'+(i===0?' on':'')+'" onclick="setFilter(this,''+c+'')">'+c+'</button>';
  }).join('');
}

function setFilter(btn,cat) {
  document.querySelectorAll('.filter-btn').forEach(function(b){b.classList.remove('on');});
  btn.classList.add('on');
  renderList(cat);
}

window.addEventListener('popstate',function(){
  var id=new URLSearchParams(window.location.search).get('id');
  if(id){goDetail(id);}else{goList();}
});

buildFilters();
renderList('全部');
var _id=new URLSearchParams(window.location.search).get('id');
if(_id){goDetail(_id);}
</script>
</body>
</html>
